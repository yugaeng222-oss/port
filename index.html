<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Yoo Gyeong - Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <div class="main-container">
        <section class="intro-section">
            <div class="text-container">
                <p class="job-title">designer & publisher</p>
                <h1 class="main-name" id="mainName">Kim Yoo Gyeong</h1>
            </div>

           <div class="portfolio-layer">
            <div class="frame-container">
                
            <div class="top-nav">
                <div class="nav-left">
                <span class="nav-item active">HOME</span>
                <span class="nav-item">ABOUT ME</span>
                <span class="nav-item">WORKS</span>
                <span class="nav-item">CONTACT</span>
            </div>

            <div class="nav-right">
                PRESENTED BY YOO GYEONG
            </div>
        </div>

        <img src="images/crowd.png" alt="Cloud" class="p-element cloud">
        <div class="portfolio-svg">
            <img src="images/portfolio.png" alt="Portfolio Logo">
        </div>
        <img src="images/rocket.png" alt="Rocket" class="p-element rocket">
        <div class="bottom-info">
            <div class="capsule-btn">UX/UI WEB DESIGNER</div>
        </div>
        </div>
        </div>
        </section>
    </div>

    <script>
        // 1. Lenis 초기화 (부드러운 스크롤)
        const lenis = new Lenis();

        lenis.on('scroll', ScrollTrigger.update);

        gsap.ticker.add((time) => {
          lenis.raf(time * 1000);
        });

        gsap.ticker.lagSmoothing(0);

        // 2. 글자 쪼개기
        const nameElement = document.getElementById("mainName");
        const text = nameElement.textContent;
        nameElement.textContent = "";

        const chars = text.split("").map((char, index) => {
            const span = document.createElement("span");
            span.textContent = char === " " ? "\u00A0" : char;
            span.className = char === " " ? "char space" : "char";
            if (index < 4) span.classList.add("kim-part");
            nameElement.appendChild(span);
            return span;
        });

        // 3. 초기 타자기 효과
        const introTl = gsap.timeline();
        introTl.to(".job-title", { opacity: 1, duration: 0.8 })
               .to(".char", {
                   opacity: 1,
                   duration: 0.05,
                   stagger: 0.08,
                   ease: "none"
               });

        // 4. 메인 스크롤 애니메이션
    const mainTl = gsap.timeline({
    scrollTrigger: {
        trigger: ".intro-section",
        start: "top top",
        end: "+=400%", // 가로 스크롤을 더 천천히 보기 위해 길이를 조금 늘렸습니다
        scrub: 1.5,
        pin: true,
        anticipatePin: 1
    }
});

mainTl
    // (1) Kim 파트와 타이틀이 사라짐
    .to(".job-title, .kim-part", { opacity: 0, y: -30, duration: 0.8 })
    
    // (2) Yoo Gyeong 확대 (이때까지는 아직 핑크 배경)
    .to(".main-name", { 
        fontSize: "500px", 
        duration: 2, 
        ease: "power2.inOut" 
    })

    // (3) 가로 스크롤 시작과 동시에 배경색/글자색 전환 (핵심 수정 부분)
    // "moveStart"라는 동일한 레이블을 주어 두 애니메이션이 동시에 시작하게 합니다.
    .to("body", { backgroundColor: "#000", duration: 2 }, "moveStart")
    .to(".main-name", { color: "#F19BB6", duration: 2 }, "moveStart")
    .to(".main-name", { 
        xPercent: -150, 
        duration: 4, // 이동 시간을 늘려 더 부드럽게 연출
        ease: "none" 
    }, "moveStart")


// (4) Portfolio 레이어 등장
    .to(".portfolio-layer", { autoAlpha: 1, duration: 0.8 })
    
    // (5) SVG, 구름, 로켓이 각자 방향에서 뿅! 등장
    .from(".portfolio-svg", { 
        scale: 0.5, 
        opacity: 0, 
        duration: 1, 
        ease: "back.out(1.7)" 
    }, "elementsAppear") // 레이블을 사용하여 동시 실행
    
    .from(".cloud", { 
        x: -300, 
        opacity: 0, 
        duration: 1.2, 
        ease: "power2.out" 
    }, "elementsAppear+=0.2") // SVG보다 약간 늦게 시작
    
    .from(".rocket", { 
        x: 300, 
        y: 200, 
        opacity: 0, 
        duration: 1.2, 
        ease: "power2.out" 
    }, "elementsAppear+=0.3"); // 로켓은 대각선 아래에서 위로
    </script>
</body>
</html>
